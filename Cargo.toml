[workspace]
resolver = "2"
members = [
  "crates/vark-config", "crates/vark-hashing", "crates/vark-tokenizer",
  "crates/vark-neurons", "crates/vark-memory", "crates/vark-learning",
  "crates/vark-decoder", "crates/vark-reasoning", "crates/vark-api", "crates/vark-cli",
  "crates/vark-conversation", "crates/vark-llm", "crates/vark-eval"
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
rayon = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
ring = "0.17"
